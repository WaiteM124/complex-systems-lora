[project]
name = "complex-systems-lora"
version = "0.1.0"
description = "Licence-tiered complex-systems QLoRA fine-tune with a budget-guarded data pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
data = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pypdf>=5.0.0",
  "pylatexenc>=2.10",
]
bedrock = [
  "boto3>=1.35.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.17.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "types-PyYAML>=6.0.12",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pypdf>=5.0.0",
  "pylatexenc>=2.10",
]
langfuse = [
  "langfuse>=5.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
