[project]
name = "ai-project"
version = "0.1.0"
description = "Replace this with a one-line description of the project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.17.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "types-PyYAML>=6.0.12",
]
langfuse = [
  "langfuse>=5.0.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
