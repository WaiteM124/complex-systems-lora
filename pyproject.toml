[project]
name = "complex-systems-lora"
version = "0.1.0"
description = "Licence-tiered complex-systems QLoRA fine-tune with a budget-guarded data pipeline."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
data = [
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pypdf>=5.0.0",
  "pylatexenc>=2.10",
]
bedrock = [
  "boto3>=1.35.0",
]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.17.0",
  "mypy>=1.13.0",
  "pre-commit>=4.0.0",
  "types-PyYAML>=6.0.12",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.0.0",
  "pypdf>=5.0.0",
  "pylatexenc>=2.10",
]
langfuse = [
  "langfuse>=5.0.0",
]
# GPU-only (Kaggle T4). Never installed in CI. Pins checked against PyPI on
# 2026-11-27 for mutual compatibility (unsloth 2026.11.12 caps transformers
# <=5.17.0, trl <=1.15.0, datasets <5, torch <2.15). Torch itself comes from the
# Kaggle image; the notebooks pin it to the installed build with a constraint.
train = [
  "unsloth==2026.11.12",
  "unsloth_zoo==2026.11.12",
  "transformers==5.17.0",
  "trl==1.15.0",
  "peft==0.22.0",
  "bitsandbytes==0.50.2",
  "accelerate==1.16.0",
  "datasets==4.8.5",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# GPU-only libraries (the `train` extra) are imported lazily and never in CI.
module = [
  "torch", "torch.*",
  "transformers", "transformers.*",
  "peft", "peft.*",
  "trl", "trl.*",
  "unsloth", "unsloth.*",
  "datasets", "datasets.*",
  "safetensors", "safetensors.*",
  "huggingface_hub", "huggingface_hub.*",
  "kaggle_secrets",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
